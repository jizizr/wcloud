[package]
name = "wcloud"
version = "0.1.0"
authors = ["afrmtbl <afrmtbl@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[profile.release]
debug = true

[dependencies]
regex = "1.7.3"
ab_glyph = "0.2.20"
# Only the pixel buffers: decoding and encoding are left to the caller.
image = { version = "0.25", default-features = false }
palette = "0.7"
woff2 = { git = "https://github.com/msarcev/woff2-rs" }
nanorand = "0.8"

serde = { version = "1.0.164", optional = true }
serde_derive = { version = "1.0.164", optional = true }
serde_json = { version = "1.0.99", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[[bench]]
name = "create_wordcloud"
harness = false

[features]
visualize = ["dep:serde", "dep:serde_derive", "dep:serde_json"]
